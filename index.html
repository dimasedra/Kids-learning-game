<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Little Champion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: none; }
        .btn-3d { transition: all 0.1s ease; }
        .btn-3d:active { transform: translateY(4px); box-shadow: none !important; }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .float-anim { animation: floatAnim 3s ease-in-out infinite; }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2 select-none overflow-hidden">

  <div class="relative w-full max-w-[420px] h-[720px] bg-white rounded-[32px] border-4 border-slate-200 shadow-2xl overflow-hidden flex flex-col justify-between">
    
    <div id="screen-cover" class="absolute inset-0 z-20 bg-gradient-to-b from-amber-50 via-sky-50 to-white p-6 flex flex-col justify-between items-center text-center pop-in">
      <div class="w-full pt-4">
        <div class="inline-flex items-center gap-1.5 bg-yellow-300/80 backdrop-blur-sm text-amber-950 text-xs font-black px-4 py-1.5 rounded-full border border-yellow-400 shadow-sm mb-3">
          <span>✨</span> COC KIDS ACADEMY <span>✨</span>
        </div>
        <h1 class="text-3xl font-black text-slate-800 tracking-tight drop-shadow-sm">LITTLE CHAMPION</h1>
        <p class="text-xs font-extrabold text-amber-700/80 mt-1 uppercase tracking-wider">Belajar Seru & Asah Logika</p>
      </div>

      <div class="my-auto py-4 relative w-full flex items-center justify-center">
        <div class="absolute w-52 h-52 bg-yellow-200/50 rounded-full blur-2xl"></div>
        <div class="absolute top-0 left-4 bg-white p-3 rounded-2xl shadow-lg border-2 border-amber-200 float-anim text-2xl">🧩</div>
        <div class="absolute bottom-2 right-4 bg-white p-3 rounded-2xl shadow-lg border-2 border-sky-200 float-anim text-2xl" style="animation-delay: 1.5s;">🚀</div>
        <div class="absolute top-6 right-6 bg-white px-3 py-1.5 rounded-xl shadow-md border border-emerald-200 text-xs font-black text-emerald-700">⭐ 100+ Soal</div>

        <div class="w-40 h-40 bg-gradient-to-tr from-yellow-400 to-amber-300 rounded-[36px] flex flex-col items-center justify-center shadow-xl border-4 border-white relative z-10 transform rotate-3">
          <div class="text-7xl drop-shadow-md">🐱</div>
          <div class="bg-amber-900 text-yellow-200 text-[10px] font-black px-2 py-0.5 rounded-md mt-1">SUPER KIDS</div>
        </div>
      </div>

      <div class="w-full space-y-3 pb-3">
        <button id="btn-start" onclick="handleStartBtn()" class="btn-3d w-full py-4 bg-amber-400 hover:bg-amber-500 border-2 border-amber-500 text-amber-950 font-black text-base rounded-2xl shadow-[0_6px_0_#d97706] tracking-wide">
          MULAI MAIN ▶
        </button>
        <button id="btn-reset" onclick="resetProgress()" class="hidden btn-3d w-full py-3 bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-500 font-bold text-xs rounded-2xl shadow-[0_4px_0_#e2e8f0]">
          Mulai Dari Awal 🔄
        </button>
      </div>
    </div>

    <div id="screen-grade" class="absolute inset-0 z-20 bg-white p-6 flex flex-col justify-between hidden pop-in">
      <div>
        <div class="flex items-center justify-between mb-6">
          <button onclick="showScreen('screen-cover')" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-600 border border-slate-200">⬅️</button>
          <h2 class="text-xl font-black text-slate-800">Pilih Tingkatan</h2>
          <div class="w-10"></div>
        </div>
        
        <div class="space-y-4">
          <button onclick="selectGrade('TK-A')" class="btn-3d w-full p-4 bg-yellow-100 border-2 border-yellow-400 rounded-2xl text-left flex items-center justify-between shadow-[0_5px_0_#eab308]">
            <div>
              <div class="font-black text-yellow-900 text-lg">TK-A (3-4 Tahun) 🐥</div>
              <div class="text-xs font-bold text-yellow-700">Hitung benda & pola sederhana</div>
            </div>
            <span class="text-2xl">➔</span>
          </button>

          <button onclick="selectGrade('TK-B')" class="btn-3d w-full p-4 bg-sky-100 border-2 border-sky-400 rounded-2xl text-left flex items-center justify-between shadow-[0_5px_0_#0284c7]">
            <div>
              <div class="font-black text-sky-900 text-lg">TK-B (5-6 Tahun) 🦊</div>
              <div class="text-xs font-bold text-sky-700">Penjumlahan & Phonics A-Z</div>
            </div>
            <span class="text-2xl">➔</span>
          </button>

          <button onclick="selectGrade('SD-1')" class="btn-3d w-full p-4 bg-emerald-100 border-2 border-emerald-400 rounded-2xl text-left flex items-center justify-between shadow-[0_5px_0_#16a34a]">
            <div>
              <div class="font-black text-emerald-900 text-lg">SD Kelas 1 (COC) 🦁</div>
              <div class="text-xs font-bold text-emerald-700">Matematika belasan & eja kata</div>
            </div>
            <span class="text-2xl">➔</span>
          </button>
        </div>
      </div>
    </div>

    <div id="screen-stage" class="absolute inset-0 z-20 bg-white p-6 flex flex-col hidden pop-in">
      <div class="flex items-center justify-between mb-4">
        <button onclick="showScreen('screen-grade')" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-600 border border-slate-200">⬅️</button>
        <h2 id="stage-title" class="text-lg font-black text-slate-800">Stage TK-A</h2>
        <div class="w-10"></div>
      </div>

      <div id="stage-grid" class="grid grid-cols-2 gap-3 overflow-y-auto pb-4">
        </div>
    </div>

    <div id="hud-bar" class="p-4 flex justify-between items-center border-b border-slate-100 z-10 bg-white">
      <button onclick="showScreen('screen-stage')" class="w-10 h-10 bg-slate-100 rounded-xl font-black text-slate-600 border border-slate-200 text-sm">🏠</button>
      <div class="flex items-center space-x-2">
        <span class="text-yellow-500 font-black text-lg">⭐ <span id="txt-score">0</span></span>
      </div>
      <div class="bg-yellow-100 border border-yellow-300 text-yellow-800 text-xs font-extrabold px-3 py-1 rounded-full" id="txt-progress">
        1/10
      </div>
    </div>

    <div class="px-4 pt-3 text-center z-10 bg-white">
      <span id="q-title" class="inline-block bg-slate-100 text-slate-700 text-xs font-black px-3 py-1 rounded-lg border border-slate-200">
        PENJUMLAHAN
      </span>
      <h3 id="q-sub" class="text-sm font-bold text-slate-400 mt-1">Hitung hasil penjumlahan berikut:</h3>
      
      <div id="q-box" class="mt-3 p-4 bg-sky-50 border-2 border-sky-300 rounded-2xl text-2xl font-black text-sky-800 shadow-sm">
        2 + 3 = ?
      </div>
    </div>

    <div class="relative flex-1 w-full bg-slate-50 flex items-center justify-center">
      <div id="phaser-canvas-container" class="w-full h-full"></div>
      <div id="feedback-toast" class="hidden absolute top-2 bg-white border-2 px-5 py-2.5 rounded-2xl text-sm font-black shadow-xl pop-in">
        🎉 BENAR! Pintar Banget!
      </div>
    </div>

    <div class="p-4 bg-white border-t border-slate-100 z-10">
      <button id="btn-check" onclick="verifyAnswerHTML()" class="btn-3d w-full py-4 bg-amber-400 hover:bg-amber-500 border-2 border-amber-500 text-amber-950 font-black text-lg rounded-2xl shadow-[0_5px_0_#d97706]">
        CEK JAWABAN ✓
      </button>
    </div>

  </div>

<script>
// State Global
let selectedGrade = 'TK-A';
let currentStage = 1;
let currentQuestionIndex = 0;
let score = 0;

let unlockedStages = { 'TK-A': 1, 'TK-B': 1, 'SD-1': 1 };
let currentQData = null;
let phaserScene = null;

// Phaser Config
const config = {
    type: Phaser.AUTO,
    parent: 'phaser-canvas-container',
    width: 380,
    height: 280,
    transparent: true,
    scene: { create: createPhaser, update: updatePhaser }
};

const phaserGame = new Phaser.Game(config);

function createPhaser() { phaserScene = this; }
function updatePhaser() {}

function showScreen(screenId) {
    document.querySelectorAll('.z-20').forEach(el => el.classList.add('hidden'));
    if (screenId) {
        document.getElementById(screenId).classList.remove('hidden');
    }
    if (screenId === 'screen-cover') updateCoverUI();
}

function updateCoverUI() {
    loadSaveData();
    const hasSave = (localStorage.getItem('LITTLE_CHAMPION_SAVE') !== null);
    const btnStart = document.getElementById('btn-start');
    const btnReset = document.getElementById('btn-reset');

    if (hasSave) {
        // Tampilkan Stage & Nomor Soal Persis yang Terakhir Dikerjakan
        btnStart.innerText = `LANJUT BELAJAR (Stg ${currentStage} - Soal ${currentQuestionIndex + 1}/10) ▶`;
        btnReset.classList.remove('hidden');
    } else {
        btnStart.innerText = 'MULAI MAIN ▶';
        btnReset.classList.add('hidden');
    }
}

function handleStartBtn() {
    loadSaveData();
    const hasSave = (localStorage.getItem('LITTLE_CHAMPION_SAVE') !== null);
    if (hasSave) {
        showScreen(null); // Langsung masuk game tanpa riset index soal
        startQuestion();
    } else {
        showScreen('screen-grade');
    }
}

function selectGrade(grade) {
    selectedGrade = grade;
    currentStage = unlockedStages[grade] || 1;
    currentQuestionIndex = 0; // Riset cuma kalo ganti grade baru
    saveProgress();
    renderStageGrid();
    showScreen('screen-stage');
}

function renderStageGrid() {
    document.getElementById('stage-title').innerText = `Stage ${selectedGrade}`;
    const grid = document.getElementById('stage-grid');
    grid.innerHTML = '';

    const maxUnlocked = unlockedStages[selectedGrade] || 1;

    for (let i = 1; i <= 10; i++) {
        const isUnlocked = i <= maxUnlocked;
        const btn = document.createElement('button');
        btn.className = `btn-3d p-4 rounded-2xl border-2 font-black text-left flex flex-col justify-between h-24 ${
            isUnlocked 
            ? 'bg-sky-100 border-sky-400 text-sky-900 shadow-[0_4px_0_#0284c7]' 
            : 'bg-slate-100 border-slate-300 text-slate-400 shadow-[0_4px_0_#cbd5e1]'
        }`;
        
        btn.innerHTML = `
            <span class="text-xs font-bold">${isUnlocked ? 'STAGE' : 'LOCKED'}</span>
            <span class="text-xl font-black">${isUnlocked ? i + ' ⭐' : '🔒 ' + i}</span>
        `;

        if (isUnlocked) {
            btn.onclick = () => {
                // Kalo milih stage dari grid, kalau stage-nya sama pake saved question index, kalo stage beda riset ke soal 1
                if (currentStage !== i) {
                    currentStage = i;
                    currentQuestionIndex = 0;
                }
                saveProgress();
                showScreen(null);
                startQuestion();
            };
        }
        grid.appendChild(btn);
    }
}

function resetProgress() {
    localStorage.removeItem('LITTLE_CHAMPION_SAVE');
    selectedGrade = 'TK-A'; currentStage = 1; currentQuestionIndex = 0; score = 0;
    unlockedStages = { 'TK-A': 1, 'TK-B': 1, 'SD-1': 1 };
    updateCoverUI();
    showScreen('screen-grade');
}

// System Auto-Save Persis Per-Soal
function saveProgress() {
    localStorage.setItem('LITTLE_CHAMPION_SAVE', JSON.stringify({
        selectedGrade, 
        currentStage, 
        currentQuestionIndex, 
        score, 
        unlockedStages
    }));
}

function loadSaveData() {
    const saved = localStorage.getItem('LITTLE_CHAMPION_SAVE');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            selectedGrade = data.selectedGrade || 'TK-A';
            currentStage = data.currentStage || 1;
            currentQuestionIndex = (data.currentQuestionIndex !== undefined) ? data.currentQuestionIndex : 0;
            score = data.score || 0;
            unlockedStages = data.unlockedStages || unlockedStages;
        } catch (e) {}
    }
}

function startQuestion() {
    document.getElementById('txt-score').innerText = score;
    document.getElementById('txt-progress').innerText = `${currentQuestionIndex + 1}/10`;

    currentQData = generateCurriculumQuestion(selectedGrade, currentStage, currentQuestionIndex);

    document.getElementById('q-title').innerText = currentQData.title;
    document.getElementById('q-sub').innerText = currentQData.sub;
    document.getElementById('q-box').innerText = currentQData.display;

    renderPhaserInteractive(currentQData);
}

// Phaser Layer
let phaserDropZone, phaserPlacedContainer, phaserSelectedValue;

function renderPhaserInteractive(qData) {
    if (!phaserScene) return;

    phaserScene.children.removeAll();
    phaserPlacedContainer = null;
    phaserSelectedValue = null;

    let dropBoxG = phaserScene.add.graphics();
    dropBoxG.fillStyle(0xffffff, 1);
    dropBoxG.fillRoundedRect(40, 20, 300, 90, 16);
    dropBoxG.lineStyle(2, 0xcbd5e1, 1);
    dropBoxG.strokeRoundedRect(40, 20, 300, 90, 16);

    let dropHint = phaserScene.add.text(190, 65, 'Taruh jawaban di sini', { font: '700 14px sans-serif', fill: '#94a3b8' }).setOrigin(0.5);

    phaserDropZone = phaserScene.add.rectangle(190, 65, 300, 90);
    phaserDropZone.isTarget = qData.target;

    qData.options.forEach((opt, idx) => {
        let total = qData.options.length;
        let startX = 190 - ((total - 1) * 55);
        let posX = startX + (idx * 110);
        let posY = 200;

        let container = phaserScene.add.container(posX, posY);
        container.origX = posX;
        container.origY = posY;

        let bgG = phaserScene.add.graphics();
        bgG.fillStyle(0xffffff, 1);
        bgG.fillRoundedRect(-40, -30, 80, 60, 14);
        bgG.lineStyle(3, 0xe2e8f0, 1);
        bgG.strokeRoundedRect(-40, -30, 80, 60, 14);

        let txt = phaserScene.add.text(0, 0, opt.toString(), { font: '800 20px sans-serif', fill: '#1e293b' }).setOrigin(0.5);

        container.add([bgG, txt]);
        container.setSize(80, 60);
        container.value = opt;

        container.setInteractive();
        phaserScene.input.setDraggable(container);

        container.on('drag', (pointer, dragX, dragY) => {
            container.x = dragX;
            container.y = dragY;
        });

        container.on('dragend', () => {
            if (Phaser.Geom.Intersects.RectangleToRectangle(container.getBounds(), phaserDropZone.getBounds())) {
                container.x = 190;
                container.y = 65;
                phaserSelectedValue = container.value;
                phaserPlacedContainer = container;
            } else {
                container.x = container.origX;
                container.y = container.origY;
                if (phaserPlacedContainer === container) {
                    phaserPlacedContainer = null;
                    phaserSelectedValue = null;
                }
            }
        });
    });
}

function verifyAnswerHTML() {
    const toast = document.getElementById('feedback-toast');

    if (!phaserSelectedValue) {
        showToast('⚠️ Taruh jawaban di kotak dulu ya!', 'border-amber-400 text-amber-900 bg-amber-50');
        return;
    }

    if (phaserSelectedValue.toString() === currentQData.target.toString()) {
        score += 10;
        showToast('🎉 BENAR! Pintar Banget!', 'border-emerald-500 text-emerald-900 bg-emerald-50');

        currentQuestionIndex++;
        
        // Cek Apakah Stage Selesai
        if (currentQuestionIndex >= 10) {
            currentQuestionIndex = 0; // Riset ke 0 buat stage baru
            if (currentStage === unlockedStages[selectedGrade] && unlockedStages[selectedGrade] < 10) {
                unlockedStages[selectedGrade]++;
            }
            saveProgress();
            setTimeout(() => {
                toast.classList.add('hidden');
                renderStageGrid();
                showScreen('screen-stage');
            }, 1200);
        } else {
            saveProgress(); // Simpan index soal nomor baru
            setTimeout(() => {
                toast.classList.add('hidden');
                startQuestion();
            }, 1200);
        }

    } else {
        showToast('❌ SALAH! Coba lagi yuk!', 'border-rose-500 text-rose-900 bg-rose-50');

        if (phaserPlacedContainer) {
            phaserScene.tweens.add({
                targets: phaserPlacedContainer,
                x: phaserPlacedContainer.origX,
                y: phaserPlacedContainer.origY,
                duration: 300
            });
            phaserPlacedContainer = null;
            phaserSelectedValue = null;
        }

        setTimeout(() => toast.classList.add('hidden'), 1500);
    }
}

function showToast(msg, classes) {
    const toast = document.getElementById('feedback-toast');
    toast.className = `absolute top-2 border-2 px-5 py-2.5 rounded-2xl text-sm font-black shadow-xl pop-in ${classes}`;
    toast.innerText = msg;
    toast.classList.remove('hidden');
}

// Curriculum Generator
function generateCurriculumQuestion(grade, stage, qIdx) {
    let pool = [];

    if (grade === 'TK-A') {
        if (stage <= 5) pool = ['COUNT_EASY', 'LOGIC_2_SIMPLE', 'PHONICS_EASY'];
        else pool = ['COUNT_MED', 'ADD_EASY', 'LOGIC_2', 'PHONICS_EASY'];
    } else if (grade === 'TK-B') {
        if (stage <= 5) pool = ['ADD_MED', 'LOGIC_2', 'PHONICS_LETTER', 'COMPARE_EASY'];
        else pool = ['ADD_HARD', 'SUB_EASY', 'LOGIC_3', 'PHONICS_LETTER', 'WORD_SPELL'];
    } else {
        if (stage <= 5) pool = ['ADD_HARD', 'SUB_MED', 'LOGIC_3', 'COMPARE_MED', 'WORD_SPELL'];
        else pool = ['MATH_ADVANCED', 'SUB_HARD', 'LOGIC_3', 'WORD_SPELL'];
    }

    let selectedType = pool[Math.floor(Math.random() * pool.length)];
    return buildQuestionByType(selectedType, stage);
}

function buildQuestionByType(type, stage) {
    if (type === 'COUNT_EASY') {
        const em = ['🍎', '🐶', '⭐', '🎈', '🐱'][Math.floor(Math.random() * 5)];
        let count = Math.floor(Math.random() * 4) + 1;
        return { title: "HITUNG BENDA", sub: "Berapa jumlah benda ini?", display: `${em} `.repeat(count), target: count, options: generateUniqueOptions(count) };
    }
    
    if (type === 'COUNT_MED') {
        const em = ['🍇', '🚗', '🐸', '🍦', '⚽'][Math.floor(Math.random() * 5)];
        let count = Math.floor(Math.random() * 4) + 4;
        return { title: "HITUNG BENDA", sub: "Berapa jumlah benda ini?", display: `${em} `.repeat(count), target: count, options: generateUniqueOptions(count) };
    }

    if (type === 'ADD_EASY') {
        let n1 = Math.floor(Math.random() * 3) + 1;
        let n2 = Math.floor(Math.random() * 2) + 1;
        let ans = n1 + n2;
        return { title: "PENJUMLAHAN", sub: "Hitung hasil penjumlahan:", display: `${n1} + ${n2} = ?`, target: ans, options: generateUniqueOptions(ans) };
    }

    if (type === 'ADD_MED') {
        let n1 = Math.floor(Math.random() * 5) + 2;
        let n2 = Math.floor(Math.random() * 4) + 1;
        let ans = n1 + n2;
        return { title: "PENJUMLAHAN", sub: "Hitung totalnya:", display: `${n1} + ${n2} = ?`, target: ans, options: generateUniqueOptions(ans) };
    }

    if (type === 'ADD_HARD') {
        let n1 = Math.floor(Math.random() * 8) + 5;
        let n2 = Math.floor(Math.random() * 6) + 3;
        let ans = n1 + n2;
        return { title: "PENJUMLAHAN", sub: "Hitung total belasan:", display: `${n1} + ${n2} = ?`, target: ans, options: generateUniqueOptions(ans) };
    }

    if (type === 'SUB_EASY') {
        let n1 = Math.floor(Math.random() * 4) + 3;
        let n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
        let ans = n1 - n2;
        return { title: "PENGURANGAN", sub: "Hitung sisanya:", display: `${n1} - ${n2} = ?`, target: ans, options: generateUniqueOptions(ans) };
    }

    if (type === 'SUB_MED' || type === 'SUB_HARD') {
        let n1 = Math.floor(Math.random() * 8) + 7;
        let n2 = Math.floor(Math.random() * 5) + 2;
        let ans = n1 - n2;
        return { title: "PENGURANGAN", sub: "Hitung sisanya:", display: `${n1} - ${n2} = ?`, target: ans, options: generateUniqueOptions(ans) };
    }

    if (type === 'MATH_ADVANCED') {
        let n1 = Math.floor(Math.random() * 6) + 5;
        let n2 = Math.floor(Math.random() * 4) + 2;
        let n3 = Math.floor(Math.random() * 3) + 1;
        let ans = n1 + n2 - n3;
        return { title: "COC MATH LAB", sub: "Hitung 3 angka ini:", display: `${n1} + ${n2} - ${n3} = ?`, target: ans, options: generateUniqueOptions(ans) };
    }

    if (type === 'COMPARE_EASY' || type === 'COMPARE_MED') {
        let n1 = Math.floor(Math.random() * 10) + 1;
        let n2 = Math.floor(Math.random() * 10) + 1;
        while (n1 === n2) n2 = Math.floor(Math.random() * 10) + 1;
        let isBigger = Math.random() > 0.5;
        let ans = isBigger ? Math.max(n1, n2) : Math.min(n1, n2);
        return { title: "BANDINGKAN ANGKA", sub: isBigger ? "Mana yang LEBIH BESAR?" : "Mana yang LEBIH KECIL?", display: `${n1}  VS  ${n2}`, target: ans, options: shuffle([n1, n2]) };
    }

    if (type === 'LOGIC_2_SIMPLE' || type === 'LOGIC_2') {
        let sets = [['🍎','🍌'], ['🐱','🐶'], ['⭐','🎈'], ['🔴','🔵'], ['🚗','🚀']][Math.floor(Math.random() * 5)];
        return { title: "SUSUN POLA", sub: "Lengkapi urutan gambar:", display: `${sets[0]}  ${sets[1]}  ${sets[0]}  [ ? ]`, target: sets[1], options: shuffle([sets[0], sets[1]]) };
    }

    if (type === 'LOGIC_3') {
        let sets = [['🔴','🟡','🔵'], ['🐱','🐶','🐰'], ['🍎','🍌','🍇'], ['⚽','🏀','🎾']][Math.floor(Math.random() * 4)];
        return { title: "SUSUN POLA 3", sub: "Lengkapi urutan 3 gambar:", display: `${sets[0]} ${sets[1]} ${sets[2]} [ ? ]`, target: sets[0], options: shuffle([sets[0], sets[1], sets[2]]) };
    }

    if (type === 'PHONICS_EASY') {
        let bank = [{ word: 'APPLE 🍎', ans: 'A' }, { word: 'BALL ⚽', ans: 'B' }, { word: 'CAT 🐱', ans: 'C' }, { word: 'DOG 🐶', ans: 'D' }];
        let item = bank[Math.floor(Math.random() * bank.length)];
        return { title: "TEBAK HURUF", sub: "Huruf pertama kata ini:", display: item.word, target: item.ans, options: shuffle([item.ans, 'E', 'F']) };
    }

    if (type === 'PHONICS_LETTER') {
        let bank = [
            { word: 'FISH 🐟', ans: 'F' }, { word: 'HAT 👒', ans: 'H' }, { word: 'ICE 🍦', ans: 'I' },
            { word: 'LION 🦁', ans: 'L' }, { word: 'MILK 🥛', ans: 'M' }, { word: 'SUN ☀️', ans: 'S' }
        ];
        let item = bank[Math.floor(Math.random() * bank.length)];
        return { title: "TEBAK HURUF", sub: "Huruf pertama kata ini:", display: item.word, target: item.ans, options: shuffle([item.ans, 'P', 'R']) };
    }

    let spellBank = [
        { disp: 'C - _ - T 🐱', ans: 'A', title: 'CAT (Kucing)', sub: 'Lengkapi huruf tengah:' },
        { disp: 'D - _ - G 🐶', ans: 'O', title: 'DOG (Anjing)', sub: 'Lengkapi huruf tengah:' },
        { disp: 'S - _ - N ☀️', ans: 'U', title: 'SUN (Matahari)', sub: 'Lengkapi huruf tengah:' },
        { disp: 'B - _ - S 🚌', ans: 'U', title: 'BUS (Bis)', sub: 'Lengkapi huruf tengah:' }
    ];
    let spell = spellBank[Math.floor(Math.random() * spellBank.length)];
    return { title: spell.title, sub: spell.sub, display: spell.disp, target: spell.ans, options: shuffle([spell.ans, 'E', 'I']) };
}

function generateUniqueOptions(correct) {
    let opts = new Set([correct]);
    while (opts.size < 3) {
        let offset = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 3) + 1);
        let val = correct + offset;
        if (val > 0) opts.add(val);
    }
    return shuffle(Array.from(opts));
}

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

updateCoverUI();
